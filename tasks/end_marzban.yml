- name: Import admin from env
  shell:
    cmd: docker exec marzban marzban-cli admin import-from-env
  register: admin_import
  retries: 15
  delay: 4
  until: admin_import.rc == 0
  failed_when: false
- name: Wait for marzban database
  wait_for:
    path: /opt/xray-vps-setup/marzban_lib/db.sqlite3
    timeout: 120
- name: Copy default host rename script
  copy:
    dest: /opt/xray-vps-setup/marzban_lib/set_default_host.py
    content: |
      import sqlite3, sys
      remark, domain = sys.argv[1], sys.argv[2]
      con = sqlite3.connect('/var/lib/marzban/db.sqlite3')
      cur = con.cursor()
      try:
          cur.execute("SELECT COUNT(*) FROM hosts WHERE remark = ?", (remark,))
          if cur.fetchone()[0]:
              print(1)
          else:
              cur.execute("UPDATE hosts SET remark = ?, address = ?, sni = ?, fingerprint = 'firefox' WHERE remark LIKE '%Marz%'", (remark, domain, domain))
              con.commit()
              print(1 if cur.rowcount else 0)
      except sqlite3.OperationalError:
          print(0)
# Marzban creates the default host ("🚀 Marz ({USERNAME}) ...", address {SERVER_IP}) on first start;
# point it at the domain and name it "🏴‍☠️ <domain> | <marzban username>"
- name: Set default host remark/address/sni
  shell:
    cmd: docker exec marzban python3 /var/lib/marzban/set_default_host.py "🏴‍☠️ {{ domain }} | {USERNAME}" "{{ domain }}"
  register: remark_result
  retries: 30
  delay: 2
  until: remark_result.stdout == "1"
  failed_when: false
- name: Remove default host rename script
  file:
    path: /opt/xray-vps-setup/marzban_lib/set_default_host.py
    state: absent
- name: Restart marzban to reload hosts
  shell:
    cmd: docker restart marzban
  when: remark_result.stdout | default("0") == "1"
- name: Print marzban panel location
  debug:
    msg: "Marzban panel: https://{{ domain }}:{{ xray_port }}/{{ MARZBAN_PATH }}/ (user: {{ MARZBAN_USER }}, password: {{ MARZBAN_PASS }})"
