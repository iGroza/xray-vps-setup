- name: Install zip
  apt:
    name:
      - zip
      - unzip
    state: present
- name: Generate marzban specific values
  block:
    - name: Generate marzban user
      set_fact:
        MARZBAN_USER: "{{ lookup('password', '/dev/null length=13 chars=ascii_letters') }}"
    - name: Generate marzban password
      set_fact:
        MARZBAN_PASS: "{{ lookup('password', '/dev/null length=42 chars=ascii_letters,digits') }}"
    - name: Generate marzban dashboard path
      set_fact:
        MARZBAN_PATH: "{{ lookup('password', '/dev/null length=42 chars=hexdigits') | lower }}"
    - name: Generate marzban subscription path
      set_fact:
        MARZBAN_SUB_PATH: "{{ lookup('password', '/dev/null length=42 chars=hexdigits') | lower }}"
- name: Create dirs
  file:
    path: "{{ item }}"
    state: directory
  loop:
    - /opt/xray-vps-setup/marzban
    - /opt/xray-vps-setup/marzban/templates
    - /opt/xray-vps-setup/marzban_lib
    - /opt/xray-vps-setup/xray-core
# Marzban's image bundles an older Xray core; run the pinned xray_version release
# instead (mounted at /code/xray-core, XRAY_EXECUTABLE_PATH in marzban/.env points at it).
- name: Download xray-core
  get_url:
    url: "https://github.com/XTLS/Xray-core/releases/download/v{{ xray_version }}/Xray-linux-{{ 'arm64-v8a' if ansible_architecture == 'aarch64' else '64' }}.zip"
    dest: /tmp/xray.zip
- name: Unzip xray-core
  unarchive:
    src: /tmp/xray.zip
    dest: /opt/xray-vps-setup/xray-core
    remote_src: yes
- name: Copy config files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
  loop:
    - { src: "angie.conf.j2", dest: "/opt/xray-vps-setup/angie.conf" }
    - { src: "xray.json.j2", dest: "/opt/xray-vps-setup/marzban/xray_config.json" }
    - { src: "marzban.j2", dest: "/opt/xray-vps-setup/marzban/.env" }
    - { src: "confluence.j2", dest: "/opt/xray-vps-setup/index.html" }
    - { src: "docker_compose.yml.j2", dest: "/opt/xray-vps-setup/docker-compose.yml" }
- debug:
    msg: "Marzban user: {{ MARZBAN_USER }}, password: {{ MARZBAN_PASS }}, marzban path: {{ MARZBAN_PATH }}"
